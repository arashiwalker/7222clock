<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Verified - 72/22 Clock</title>
    <link rel="icon" href="/images/favicon7222.jpeg?v=2" type="image/jpeg">
    <link rel="shortcut icon" href="/images/favicon7222.jpeg?v=2" type="image/jpeg">
    <link rel="apple-touch-icon" href="/images/favicon7222.jpeg?v=2">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 id="successHeader">Checking subscription?</h1>
        <p id="successMessage">Verifying your $3.27/month unlock with Stripe.</p>
        <p id="sessionId"></p>
        <p id="verifyStatus" class="payment-note"></p>
        <a href="/">Back to 72/22 Clock</a>
    </div>
    <footer>
        <p>&copy; 2025 7222clock.com <span class="copyright-tooltip">All Rights Reserved. Unauthorized use prohibited.</span></p>
    </footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const header = document.getElementById('successHeader');
        const message = document.getElementById('successMessage');
        const statusEl = document.getElementById('verifyStatus');

        if (!sessionId) {
            header.textContent = 'No subscription to verify';
            message.textContent = 'Missing checkout session. Returning home.';
            setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
            document.getElementById('sessionId').textContent = 'Reference: ' + sessionId;
            fetch('/complete-checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ session_id: sessionId })
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.unlocked) {
                        header.textContent = 'Analog unlocked';
                        message.textContent = 'Your $3.27/month subscription is active. The analog clock is unlocked on this browser.';
                        statusEl.textContent = 'Status: subscribed';
                    } else {
                        header.textContent = 'Not unlocked yet';
                        message.textContent = data.error || 'Stripe did not confirm an active subscription.';
                        statusEl.textContent = 'Status: ' + (data.payment_status || 'unknown');
                    }
                })
                .catch((error) => {
                    console.error('Error verifying subscription:', error);
                    header.textContent = 'Could not verify yet';
                    message.textContent = 'Refresh this page, or return home and try again.';
                });
        }
    </script>
</body>
</html>
