<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>72/22 Clock</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/images/favicon7222.jpeg?v=2">
    <meta property="og:title" content="72/22 Clock">
    <meta property="og:description" content="Discover the Mirtha, a new way to measure time with the 72/22 Clock.">
    <meta property="og:image" content="/images/favicon7222.jpeg?v=2">
    <meta property="og:url" content="https://7222clock.com">
    <meta property="og:type" content="website">
    <meta name="twitter:image" content="/images/favicon7222.jpeg?v=2">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/images/favicon7222.jpeg?v=2" type="image/jpeg">
    <link rel="shortcut icon" href="/images/favicon7222.jpeg?v=2" type="image/jpeg">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="clock-section">
                <div class="clock-container">
                    <canvas id="clockCanvas"></canvas>
                </div>
                <div class="digital-clock">
                    <div class="flip-container">
                        <span class="huor" id="huor">00</span><span class="colon">:</span><span class="minit" id="minit">00</span><span class="colon">:</span><span class="mirtha" id="mirtha">00</span>
                    </div>
                </div>
            </div>
            <div class="info-section">
                <div class="info-box">
                    <div class="interval-description">
                        <p class="mirtha-intro">72/22 Clock introduces the Mirtha. Replacement of the Second</p>
                        <ul>
                            <li><strong class="mirtha">MIRTHA</strong> <span class="desc">1 Mirtha = 72/22 || 3.27273seconds</span></li>
                            <li><strong class="minit">MINIT</strong> <span class="desc">1 Minit = 22 Mirthas</span></li>
                            <li><strong class="huor">HUOR</strong> <span class="desc">1 Huor = 50 Minits</span></li>
                        </ul>
                        <button id="toggleSound">Sound: On</button>
                    </div>
                </div>
                <div class="payment-box">
                    <p class="donate-label">One-time payment</p>
                    <p class="payment-amount">$7.22</p>
                    <button type="button" id="stripeCheckoutButton" class="stripe-checkout-btn">Pay $7.22</button>
                    <p id="stripeErrorMessage" class="stripe-error" style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 7222clock.com <span class="copyright-tooltip">All Rights Reserved. Unauthorized use prohibited.</span></p>
    </footer>
    <script src="/stripe-config.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="clock.js"></script>
    <script>
        const DONATION_AMOUNT_CENTS = 722;

        });

        const stripeButton = document.getElementById('stripeCheckoutButton');
        const stripeErrorMessage = document.getElementById('stripeErrorMessage');

        function showStripeError(message) {
            stripeErrorMessage.textContent = message;
            stripeErrorMessage.style.display = 'block';
        }

        if (stripeButton) {
            stripeButton.addEventListener('click', async () => {
                stripeErrorMessage.style.display = 'none';
                stripeButton.disabled = true;

                try {
                    if (!window.STRIPE_PUBLISHABLE_KEY) {
                        throw new Error('Stripe publishable key is missing.');
                    }

                    const response = await fetch('/create-checkout-session', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ amount: DONATION_AMOUNT_CENTS })
                    });

                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || (`HTTP ${response.status}`));
                    }
                    if (!payload.url) {
                        throw new Error('No checkout URL returned.');
                    }

                    window.location.href = payload.url;
                } catch (error) {
                    console.error('MirthaNode: Stripe checkout error:', error);
                    showStripeError(error.message || 'Payment error. Please try again.');
                    stripeButton.disabled = false;
                }
            });
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch((err) => console.log('Service Worker registration failed:', err));
      }
    </script>
</body>
</html>
